services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: wxr_dev
      POSTGRES_PASSWORD: synthetic-local-only
      POSTGRES_DB: sc_wxr094_dev
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wxr_dev -d sc_wxr094_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      SC_WORKSPACE_DATABASE_URL: postgresql+psycopg://wxr_dev:synthetic-local-only@postgres:5432/sc_wxr094_dev
      SC_WORKSPACE_AUTO_CREATE_SCHEMA: "false"
      SC_WORKSPACE_SESSION_SIGNING_SECRET: synthetic-local-only
      SC_WORKSPACE_SERVICE_TOKEN: synthetic-local-service-only
      SC_WORKSPACE_OBJECT_STORAGE_ROOT: /data/objects
    ports:
      - "127.0.0.1:18089:8089"
    volumes:
      - objects:/data
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./Caddyfile.compose:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend

volumes:
  pg_data:
  objects:
