name: RH-PROD-05.1 isolated security acceptance

on:
  pull_request:
    paths:
      - 'backend/app/session_auth.py'
      - 'backend/app/session_revocation.py'
      - 'backend/app/research_session_introspection.py'
      - 'backend/app/config.py'
      - 'backend/app/migrate_security.py'
      - 'backend/app/research_introspection_entry.py'
      - 'backend/app/db.py'
      - 'backend/migrations/051_workspace_session_revocation.sql'
      - 'backend/tests/test_rhprod05_*.py'
      - 'backend/tests/test_standalone_auth_session_foundation_v3710.py'
      - 'scripts/rhprod05_compare_pytest_junit.py'
      - 'scripts/rhprod05_run_backend_diff.py'
      - 'scripts/tests/test_rhprod05_run_backend_diff.py'
      - 'scripts/tests/test_rhprod05_compare_pytest_junit.py'
      - '.github/workflows/rh-prod-05-1-isolated-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-auth-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rhprod05_acceptance
          POSTGRES_USER: rhprod05_tester
          POSTGRES_PASSWORD: ci-only-disposable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rhprod05_tester -d rhprod05_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RH_PROD05_TEST_DATABASE_URL: postgresql+psycopg://rhprod05_tester:ci-only-disposable@127.0.0.1:5432/rhprod05_acceptance
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated authentication test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'fastapi==0.128.2' 'SQLAlchemy==2.0.50' \
            'psycopg[binary]>=3.2,<4' 'pydantic-settings==2.14.1' \
            'pytest>=8,<10' 'httpx==0.28.1'
      - name: Static compile of changed source
        run: |
          python -m compileall -q backend/app/session_auth.py backend/app/session_revocation.py backend/app/research_session_introspection.py backend/tests/test_rhprod05_*.py
      - name: Legacy session and new security regression
        run: |
          python -m pytest -q \
            backend/tests/test_standalone_auth_session_foundation_v3710.py \
            backend/tests/test_rhprod05_coordinated_bridge.py \
            backend/tests/test_rhprod05_session_revocation.py \
            backend/tests/test_rhprod05_introspection_auth.py \
            backend/tests/test_rhprod05_logout_replay.py \
            backend/tests/test_rhprod05_postgres_acceptance.py
      - name: Test baseline/candidate regression classifier
        run: |
          python -m unittest discover -s scripts/tests -p 'test_rhprod05_*.py' -v
      - name: Verify isolated database is the only test target
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          url = urlparse(os.environ['RH_PROD05_TEST_DATABASE_URL'].replace('postgresql+psycopg', 'postgresql'))
          assert url.hostname == '127.0.0.1'
          assert url.path == '/rhprod05_acceptance'
          print('Disposable CI PostgreSQL only; no Contabo access')
          PY
