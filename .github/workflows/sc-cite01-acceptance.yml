name: SC-CITE-01 Citation Studio acceptance

on:
  pull_request:
    paths:
      - 'backend/app/citation_studio.py'
      - 'backend/app/reporting_publication.py'
      - 'backend/tests/test_sc_cite01_*.py'
      - '.github/workflows/sc-cite01-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-reporting.txt
      - name: Install test and Reporting Studio dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-reporting.txt pytest
          python -m pip check
      - name: Existing Citation Studio regressions and synthetic full-route workflow
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pytest -q \
            tests/test_sc_cite01_citation_studio.py \
            tests/test_sc_cite01_synthetic_workflow.py
      - name: Scope and deployment warning
        run: |
          echo 'This workflow covers offline synthetic route tests only.'
          echo 'It does NOT certify PostgreSQL persistence, Research editorial integration,'
          echo 'off-host recovery or production cutover.'
