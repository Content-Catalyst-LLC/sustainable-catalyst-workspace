name: Controlled recovery regression
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/recovery-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: recovery_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: sc_recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U recovery_test -d sc_recovery_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install existing backend and test dependencies
        run: python -m pip install -r backend/requirements.txt pytest==9.0.2
      - name: Prepare isolated restore-rehearsal database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$PG_CONTAINER" createdb -U recovery_test sc_recovery_rehearsal
      - name: Test real PostgreSQL transactions, backups and restoration
        env:
          SC_RECOVERY_TEST_DATABASE_URL: postgresql+psycopg://recovery_test:synthetic-ci-only@localhost:5432/sc_recovery_test
          SC_RECOVERY_PG_CONTAINER: ${{ job.services.postgres.id }}
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          backend/tests/test_controlled_recovery.py
          backend/tests/test_recovery_reconciliation.py
      - name: Existing identity, recovery and project regression
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          backend/tests/test_wxr_recovery_review.py
          backend/tests/test_standalone_auth_session_foundation_v3710.py
          backend/tests/test_backend_domain_authority_v2240.py
          backend/tests/test_backend_policy_identity_authorization_v2340.py
          backend/tests/test_local_first_sync_v2310.py
          backend/tests/test_cross_product_research_handoff_consolidation_v3680.py
          backend/tests/test_portable_research_workspace_recovery_v3690.py
          backend/tests/test_integrated_project_workspace_v3800.py
          backend/tests/test_existing_erw_identity_bridge.py

      - name: WXR-09.3 signed-session project and upload integration
        env:
          SC_RECOVERY_TEST_DATABASE_URL: postgresql+psycopg://recovery_test:synthetic-ci-only@localhost:5432/sc_recovery_test
          SC_RECOVERY_PG_CONTAINER: ${{ job.services.postgres.id }}
          PYTHONPATH: backend
        run: |
          python -m pytest -q backend/tests/test_wxr_private_projects.py
          node tests/node/wxr093_same_origin.js
      - name: Build immutable candidate image without publishing or deploying
        run: |
          source_commit=$(git rev-parse HEAD)
          docker build --pull --file backend/Dockerfile --tag wxr-09-3-candidate:${source_commit} backend
          image_id=$(docker image inspect --format='{{.Id}}' wxr-09-3-candidate:${source_commit})
          echo "Source commit: ${source_commit}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "CI-built image ID: ${image_id}" | tee -a "$GITHUB_STEP_SUMMARY"
