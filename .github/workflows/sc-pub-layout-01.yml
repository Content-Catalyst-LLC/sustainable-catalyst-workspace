name: SC-PUB-LAYOUT-01 Manuscript Layout Integrity

on:
  pull_request:
    paths:
      - 'backend/app/publication_layout.py'
      - 'backend/app/reporting_publication*'
      - 'backend/tests/test_sc_pub_layout01.py'
      - '.github/workflows/sc-pub-layout-01.yml'
  push:
    branches: [main]
    paths:
      - 'backend/app/publication_layout.py'
      - 'backend/app/reporting_publication*'
      - 'backend/tests/test_sc_pub_layout01.py'
      - '.github/workflows/sc-pub-layout-01.yml'

permissions:
  contents: read

jobs:
  layout:
    name: Validate cross-format layout, deterministic figure placement and immutable source
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate authenticated Studio UI syntax and source adapters
        run: |
          node --check backend/app/reporting_publication_ui.js
          node --check backend/app/reporting_publication_visual.js
          test -f backend/app/reporting_publication_ui.html
          grep -Fq 'id="layoutMove"' backend/app/reporting_publication_ui.html
          grep -Fq 'layout/move-figure' backend/app/reporting_publication_ui.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Reporting Studio scientific export dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libcairo2-dev libffi-dev
          python -m pip install --disable-pip-version-check -r backend/requirements.txt -r backend/requirements-reporting.txt
      - name: Strict syntax checks
        run: |
          python -m py_compile backend/app/publication_layout.py backend/app/reporting_publication.py backend/tests/test_sc_pub_layout01.py
      - name: New layout and existing scientific publication regression contracts
        run: |
          PYTHONPATH=backend python -m unittest \
            backend.tests.test_sc_pub_layout01 \
            backend.tests.test_sc_pub_vis01_branded_editor \
            backend.tests.test_rd012_reporting_studio_recovery -v
