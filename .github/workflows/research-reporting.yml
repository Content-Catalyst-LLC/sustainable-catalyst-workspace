name: Private research reporting regression
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'schemas/sc-research-visual-asset-1.0.schema.json'
      - '.github/workflows/research-reporting.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-reporting:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: backend/reporting_math/package-lock.json
      - name: Install isolated test and optional export dependencies
        run: |
          python -m pip install -r backend/requirements.txt -r backend/requirements-reporting.txt pytest==9.0.2 jsonschema==4.26.0
          npm ci --prefix backend/reporting_math --ignore-scripts
      - name: Native reporting and existing identity persistence regressions
        working-directory: backend
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_research_reporting.py
          tests/test_reporting_g1_acceptance.py
          tests/test_wxr10_staging_origin.py
          tests/test_wxr_private_projects.py
          tests/test_existing_erw_identity_bridge.py
          tests/test_standalone_auth_session_foundation_v3710.py
          tests/test_wxr_recovery_review.py
          tests/test_controlled_recovery.py
          tests/test_recovery_reconciliation.py
          tests/test_lab_figure_reporting_v3842.py
          tests/test_lab_publication_adapter_v3843.py
          tests/test_lab_live_figure_acceptance_v3844.py
      - name: Optional runtime audit and editor syntax
        run: |
          npm audit --prefix backend/reporting_math --omit=dev
          node --check backend/app/research_reporting_ui.js
  postgres-reporting:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: recovery_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: sc_recovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U recovery_test -d sc_recovery_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated backend and reporting dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-reporting.txt pytest==9.0.2
      - name: Prepare separate restore database
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: docker exec "$PG_CONTAINER" createdb -U recovery_test sc_g1_restore_test
      - name: G1 PostgreSQL authorization, concurrent revisions and paired restore
        env:
          SC_RECOVERY_TEST_DATABASE_URL: postgresql+psycopg://recovery_test:synthetic-ci-only@127.0.0.1:5432/sc_recovery_test
          SC_RECOVERY_PG_CONTAINER: ${{ job.services.postgres.id }}
          PYTHONPATH: backend:backend/tests
        run: python -m pytest -q backend/tests/test_g1_reporting_postgres.py
