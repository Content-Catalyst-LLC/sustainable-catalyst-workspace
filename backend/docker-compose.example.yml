services:
  sc-workspace-backend:
    build: .
    container_name: sc-workspace-backend
    restart: unless-stopped
    environment: &workspace-env
      SC_WORKSPACE_DATABASE_URL: postgresql+psycopg://sc_workspace:${SC_WORKSPACE_DB_PASSWORD}@sc-postgres:5432/sc_workspace
      SC_WORKSPACE_SERVICE_TOKEN: ${SC_WORKSPACE_SERVICE_TOKEN}
      SC_WORKSPACE_RUNTIME_ATTESTATION_TOKEN: ${SC_WORKSPACE_RUNTIME_ATTESTATION_TOKEN}
      SC_WORKSPACE_MAX_ATTESTATION_VERIFICATIONS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_ATTESTATION_VERIFICATIONS_PER_ACCOUNT:-5000}
      SC_WORKSPACE_MAX_COMPLIANCE_WAIVERS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_COMPLIANCE_WAIVERS_PER_ACCOUNT:-1000}
      SC_WORKSPACE_MAX_RUNTIME_TRUST_POLICIES_PER_ACCOUNT: ${SC_WORKSPACE_MAX_RUNTIME_TRUST_POLICIES_PER_ACCOUNT:-250}
      SC_WORKSPACE_ENVIRONMENT: production
      SC_WORKSPACE_AUTO_CREATE_SCHEMA: "false"
      SC_WORKSPACE_OBJECT_STORAGE_ROOT: /data/objects
      SC_WORKSPACE_ROUTE_CORE_URL: ${SC_WORKSPACE_ROUTE_CORE_URL:-}
      SC_WORKSPACE_ROUTE_CORE_TOKEN: ${SC_WORKSPACE_ROUTE_CORE_TOKEN:-}
      SC_WORKSPACE_ROUTE_LAB_URL: ${SC_WORKSPACE_ROUTE_LAB_URL:-}
      SC_WORKSPACE_ROUTE_LAB_TOKEN: ${SC_WORKSPACE_ROUTE_LAB_TOKEN:-}
      SC_WORKSPACE_ROUTE_WORKBENCH_URL: ${SC_WORKSPACE_ROUTE_WORKBENCH_URL:-}
      SC_WORKSPACE_ROUTE_WORKBENCH_TOKEN: ${SC_WORKSPACE_ROUTE_WORKBENCH_TOKEN:-}
      SC_WORKSPACE_ROUTE_DECISION_STUDIO_URL: ${SC_WORKSPACE_ROUTE_DECISION_STUDIO_URL:-}
      SC_WORKSPACE_ROUTE_DECISION_STUDIO_TOKEN: ${SC_WORKSPACE_ROUTE_DECISION_STUDIO_TOKEN:-}
      SC_WORKSPACE_ROUTE_LIBRARY_URL: ${SC_WORKSPACE_ROUTE_LIBRARY_URL:-}
      SC_WORKSPACE_ROUTE_LIBRARY_TOKEN: ${SC_WORKSPACE_ROUTE_LIBRARY_TOKEN:-}
      SC_WORKSPACE_ROUTE_SITE_INTELLIGENCE_URL: ${SC_WORKSPACE_ROUTE_SITE_INTELLIGENCE_URL:-}
      SC_WORKSPACE_ROUTE_SITE_INTELLIGENCE_TOKEN: ${SC_WORKSPACE_ROUTE_SITE_INTELLIGENCE_TOKEN:-}
      SC_WORKSPACE_MAX_REPRODUCTION_EXECUTION_PLANS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_REPRODUCTION_EXECUTION_PLANS_PER_ACCOUNT:-1000}
      SC_WORKSPACE_MAX_RUNTIME_HANDOFF_RECEIPTS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_RUNTIME_HANDOFF_RECEIPTS_PER_ACCOUNT:-2000}
      SC_WORKSPACE_MAX_RUNTIME_EXECUTION_ATTESTATIONS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_RUNTIME_EXECUTION_ATTESTATIONS_PER_ACCOUNT:-5000}
      SC_WORKSPACE_COMPUTE_MAX_ROWS: ${SC_WORKSPACE_COMPUTE_MAX_ROWS:-50000}
      SC_WORKSPACE_COMPUTE_MAX_COLUMNS: ${SC_WORKSPACE_COMPUTE_MAX_COLUMNS:-256}
      SC_WORKSPACE_COMPUTE_MAX_MATRIX_DIMENSION: ${SC_WORKSPACE_COMPUTE_MAX_MATRIX_DIMENSION:-512}
      SC_WORKSPACE_COMPUTE_MAX_SYMBOLIC_CHARS: ${SC_WORKSPACE_COMPUTE_MAX_SYMBOLIC_CHARS:-4000}
      SC_WORKSPACE_COMPUTE_MAX_SYMBOLIC_OPERATIONS: ${SC_WORKSPACE_COMPUTE_MAX_SYMBOLIC_OPERATIONS:-2000}
      SC_WORKSPACE_COMPUTE_MAX_OPTIMIZER_ITERATIONS: ${SC_WORKSPACE_COMPUTE_MAX_OPTIMIZER_ITERATIONS:-1000}
      SC_WORKSPACE_COMPUTE_MAX_POLYNOMIAL_DEGREE: ${SC_WORKSPACE_COMPUTE_MAX_POLYNOMIAL_DEGREE:-256}
      SC_WORKSPACE_COMPUTE_MAX_RESULT_BYTES: ${SC_WORKSPACE_COMPUTE_MAX_RESULT_BYTES:-10485760}
      SC_WORKSPACE_RUNTIME_R_URL: ${SC_WORKSPACE_RUNTIME_R_URL:-http://sc-workspace-r-runtime:8090/v1/execute}
      SC_WORKSPACE_RUNTIME_R_TOKEN: ${SC_WORKSPACE_RUNTIME_R_TOKEN:-}
      SC_WORKSPACE_RUNTIME_JULIA_URL: ${SC_WORKSPACE_RUNTIME_JULIA_URL:-http://sc-workspace-julia-runtime:8091/v1/execute}
      SC_WORKSPACE_RUNTIME_JULIA_TOKEN: ${SC_WORKSPACE_RUNTIME_JULIA_TOKEN:-}
      SC_WORKSPACE_RUNTIME_ML_URL: ${SC_WORKSPACE_RUNTIME_ML_URL:-http://sc-workspace-ml-runtime:8092/v1/execute}
      SC_WORKSPACE_RUNTIME_ML_TOKEN: ${SC_WORKSPACE_RUNTIME_ML_TOKEN:-}
      SC_WORKSPACE_RUNTIME_INTERCHANGE_URL: ${SC_WORKSPACE_RUNTIME_INTERCHANGE_URL:-http://sc-workspace-interchange-runtime:8093/v1/execute}
      SC_WORKSPACE_RUNTIME_INTERCHANGE_TOKEN: ${SC_WORKSPACE_RUNTIME_INTERCHANGE_TOKEN:-}
      SC_WORKSPACE_RUNTIME_FORECAST_URL: ${SC_WORKSPACE_RUNTIME_FORECAST_URL:-http://sc-workspace-forecast-runtime:8095/v1/execute}
      SC_WORKSPACE_RUNTIME_FORECAST_TOKEN: ${SC_WORKSPACE_RUNTIME_FORECAST_TOKEN:-}
      SC_WORKSPACE_RUNTIME_PROBABILITY_URL: ${SC_WORKSPACE_RUNTIME_PROBABILITY_URL:-http://sc-workspace-probability-runtime:8096/v1/execute}
      SC_WORKSPACE_RUNTIME_PROBABILITY_TOKEN: ${SC_WORKSPACE_RUNTIME_PROBABILITY_TOKEN:-}
      SC_WORKSPACE_MAX_PROBABILISTIC_INFERENCE_RECEIPTS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_PROBABILISTIC_INFERENCE_RECEIPTS_PER_ACCOUNT:-10000}
      SC_WORKSPACE_RUNTIME_UNCERTAINTY_URL: ${SC_WORKSPACE_RUNTIME_UNCERTAINTY_URL:-http://sc-workspace-uncertainty-runtime:8097/v1/execute}
      SC_WORKSPACE_RUNTIME_UNCERTAINTY_TOKEN: ${SC_WORKSPACE_RUNTIME_UNCERTAINTY_TOKEN:-}
      SC_WORKSPACE_MAX_UNCERTAINTY_ANALYSIS_RECEIPTS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_UNCERTAINTY_ANALYSIS_RECEIPTS_PER_ACCOUNT:-10000}
      SC_WORKSPACE_RUNTIME_OPTIMIZATION_URL: ${SC_WORKSPACE_RUNTIME_OPTIMIZATION_URL:-http://sc-workspace-optimization-runtime:8098/v1/execute}
      SC_WORKSPACE_RUNTIME_OPTIMIZATION_TOKEN: ${SC_WORKSPACE_RUNTIME_OPTIMIZATION_TOKEN:-}
      SC_WORKSPACE_RUNTIME_DECISION_URL: ${SC_WORKSPACE_RUNTIME_DECISION_URL:-http://sc-workspace-decision-runtime:8099/v1/execute}
      SC_WORKSPACE_RUNTIME_DECISION_TOKEN: ${SC_WORKSPACE_RUNTIME_DECISION_TOKEN:-}
      SC_WORKSPACE_RUNTIME_RELIABILITY_URL: ${SC_WORKSPACE_RUNTIME_RELIABILITY_URL:-http://sc-workspace-reliability-runtime:8100/v1/execute}
      SC_WORKSPACE_RUNTIME_RELIABILITY_TOKEN: ${SC_WORKSPACE_RUNTIME_RELIABILITY_TOKEN:-}
      SC_WORKSPACE_MAX_RELIABILITY_ANALYSIS_RECEIPTS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_RELIABILITY_ANALYSIS_RECEIPTS_PER_ACCOUNT:-10000}
      SC_WORKSPACE_MAX_DECISION_OPTIMIZATION_RECEIPTS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_DECISION_OPTIMIZATION_RECEIPTS_PER_ACCOUNT:-10000}
      SC_WORKSPACE_MAX_OPTIMIZATION_RECEIPTS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_OPTIMIZATION_RECEIPTS_PER_ACCOUNT:-10000}
      SC_WORKSPACE_MAX_FORECAST_RECEIPTS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_FORECAST_RECEIPTS_PER_ACCOUNT:-10000}
      SC_WORKSPACE_MAX_FORECAST_EVALUATION_RECEIPTS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_FORECAST_EVALUATION_RECEIPTS_PER_ACCOUNT:-10000}
      SC_WORKSPACE_INTERCHANGE_TIMEOUT_SECONDS: ${SC_WORKSPACE_INTERCHANGE_TIMEOUT_SECONDS:-60}
      SC_WORKSPACE_MAX_INTERCHANGE_RECEIPTS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_INTERCHANGE_RECEIPTS_PER_ACCOUNT:-10000}
      SC_WORKSPACE_MAX_CROSS_RUNTIME_VERIFICATION_RECEIPTS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_CROSS_RUNTIME_VERIFICATION_RECEIPTS_PER_ACCOUNT:-10000}
      SC_WORKSPACE_RUNTIME_WASM_URL: ${SC_WORKSPACE_RUNTIME_WASM_URL:-}
      SC_WORKSPACE_RUNTIME_WASM_TOKEN: ${SC_WORKSPACE_RUNTIME_WASM_TOKEN:-}
      SC_WORKSPACE_POLYGLOT_TIMEOUT_SECONDS: ${SC_WORKSPACE_POLYGLOT_TIMEOUT_SECONDS:-45}
      SC_WORKSPACE_POLYGLOT_MAX_EXCHANGE_ROWS: ${SC_WORKSPACE_POLYGLOT_MAX_EXCHANGE_ROWS:-50000}
      SC_WORKSPACE_POLYGLOT_MAX_EXCHANGE_COLUMNS: ${SC_WORKSPACE_POLYGLOT_MAX_EXCHANGE_COLUMNS:-256}
      SC_WORKSPACE_POLYGLOT_MAX_PAYLOAD_BYTES: ${SC_WORKSPACE_POLYGLOT_MAX_PAYLOAD_BYTES:-10485760}
      SC_WORKSPACE_MAX_STATISTICAL_MODEL_RECEIPTS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_STATISTICAL_MODEL_RECEIPTS_PER_ACCOUNT:-5000}
      SC_WORKSPACE_MAX_NUMERICAL_SIMULATION_RECEIPTS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_NUMERICAL_SIMULATION_RECEIPTS_PER_ACCOUNT:-5000}
      SC_WORKSPACE_MAX_PREDICTIVE_MODEL_RECEIPTS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_PREDICTIVE_MODEL_RECEIPTS_PER_ACCOUNT:-5000}
      SC_WORKSPACE_MAX_MODEL_EVALUATION_RECEIPTS_PER_ACCOUNT: ${SC_WORKSPACE_MAX_MODEL_EVALUATION_RECEIPTS_PER_ACCOUNT:-10000}
      SC_WORKSPACE_PLATFORM_CORE_URL: ${SC_WORKSPACE_PLATFORM_CORE_URL:-http://sc-core:8090}
      SC_WORKSPACE_PLATFORM_CORE_WRITE_API_KEY: ${SC_WORKSPACE_PLATFORM_CORE_WRITE_API_KEY:-}
      SC_WORKSPACE_PLATFORM_CORE_TIMEOUT_SECONDS: ${SC_WORKSPACE_PLATFORM_CORE_TIMEOUT_SECONDS:-15}
    networks:
      - sc-internal
      - sc-workspace-runtime
    ports:
      - "127.0.0.1:8094:8089"
    volumes:
      - sc-workspace-data:/data

  sc-workspace-worker:
    build: .
    container_name: sc-workspace-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *workspace-env
    networks:
      - sc-internal
      - sc-workspace-runtime
    volumes:
      - sc-workspace-data:/data
    depends_on:
      - sc-workspace-backend
      - sc-workspace-r-runtime
      - sc-workspace-julia-runtime
      - sc-workspace-ml-runtime
      - sc-workspace-interchange-runtime
      - sc-workspace-forecast-runtime
      - sc-workspace-probability-runtime
      - sc-workspace-uncertainty-runtime
      - sc-workspace-optimization-runtime
      - sc-workspace-decision-runtime
      - sc-workspace-reliability-runtime
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 256
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m

  sc-workspace-r-runtime:
    build: ./r-runtime
    container_name: sc-workspace-r-runtime
    restart: unless-stopped
    environment:
      SC_WORKSPACE_R_RUNTIME_TOKEN: ${SC_WORKSPACE_RUNTIME_R_TOKEN}
      SC_WORKSPACE_R_TIMEOUT_SECONDS: ${SC_WORKSPACE_R_TIMEOUT_SECONDS:-40}
      SC_WORKSPACE_R_MAX_PAYLOAD_BYTES: ${SC_WORKSPACE_POLYGLOT_MAX_PAYLOAD_BYTES:-10485760}
    networks:
      - sc-workspace-runtime
    cpus: 1.5
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m

  sc-workspace-julia-runtime:
    build: ./julia-runtime
    container_name: sc-workspace-julia-runtime
    restart: unless-stopped
    environment:
      SC_WORKSPACE_JULIA_RUNTIME_TOKEN: ${SC_WORKSPACE_RUNTIME_JULIA_TOKEN}
      SC_WORKSPACE_JULIA_TIMEOUT_SECONDS: ${SC_WORKSPACE_JULIA_TIMEOUT_SECONDS:-60}
      SC_WORKSPACE_JULIA_MAX_PAYLOAD_BYTES: ${SC_WORKSPACE_POLYGLOT_MAX_PAYLOAD_BYTES:-10485760}
    networks:
      - sc-workspace-runtime
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m

  sc-workspace-ml-runtime:
    build: ./ml-runtime
    container_name: sc-workspace-ml-runtime
    restart: unless-stopped
    environment:
      SC_WORKSPACE_ML_RUNTIME_TOKEN: ${SC_WORKSPACE_RUNTIME_ML_TOKEN}
      SC_WORKSPACE_ML_TIMEOUT_SECONDS: ${SC_WORKSPACE_ML_TIMEOUT_SECONDS:-90}
      SC_WORKSPACE_ML_MAX_PAYLOAD_BYTES: ${SC_WORKSPACE_POLYGLOT_MAX_PAYLOAD_BYTES:-10485760}
      SC_WORKSPACE_ML_MAX_ROWS: ${SC_WORKSPACE_COMPUTE_MAX_ROWS:-50000}
      SC_WORKSPACE_ML_MAX_FEATURES: ${SC_WORKSPACE_ML_MAX_FEATURES:-128}
      SC_WORKSPACE_ML_MAX_MODEL_BYTES: ${SC_WORKSPACE_MAX_ARTIFACT_BYTES:-20971520}
    networks:
      - sc-workspace-runtime
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m

  sc-workspace-forecast-runtime:
    build: ./forecast-runtime
    container_name: sc-workspace-forecast-runtime
    restart: unless-stopped
    environment:
      SC_WORKSPACE_FORECAST_RUNTIME_TOKEN: ${SC_WORKSPACE_RUNTIME_FORECAST_TOKEN}
      SC_WORKSPACE_FORECAST_MAX_PAYLOAD_BYTES: ${SC_WORKSPACE_POLYGLOT_MAX_PAYLOAD_BYTES:-10485760}
      SC_WORKSPACE_FORECAST_MAX_POINTS: ${SC_WORKSPACE_COMPUTE_MAX_ROWS:-50000}
      SC_WORKSPACE_FORECAST_MAX_HORIZON: ${SC_WORKSPACE_FORECAST_MAX_HORIZON:-3650}
      SC_WORKSPACE_FORECAST_MAX_SEASONAL_PERIOD: ${SC_WORKSPACE_FORECAST_MAX_SEASONAL_PERIOD:-365}
    networks:
      - sc-workspace-runtime
    cpus: 2.0
    mem_limit: 2g
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m


  sc-workspace-probability-runtime:
    build: ./probability-runtime
    container_name: sc-workspace-probability-runtime
    restart: unless-stopped
    environment:
      SC_WORKSPACE_PROBABILITY_RUNTIME_TOKEN: ${SC_WORKSPACE_RUNTIME_PROBABILITY_TOKEN}
      SC_WORKSPACE_PROBABILITY_MAX_DRAWS: ${SC_WORKSPACE_PROBABILITY_MAX_DRAWS:-20000}
    networks:
      - sc-workspace-runtime
    cpus: 1.5
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m

  sc-workspace-uncertainty-runtime:
    build: ./uncertainty-runtime
    container_name: sc-workspace-uncertainty-runtime
    restart: unless-stopped
    environment:
      SC_WORKSPACE_UNCERTAINTY_RUNTIME_TOKEN: ${SC_WORKSPACE_RUNTIME_UNCERTAINTY_TOKEN}
      SC_WORKSPACE_UNCERTAINTY_MAX_DRAWS: ${SC_WORKSPACE_UNCERTAINTY_MAX_DRAWS:-20000}
      SC_WORKSPACE_UNCERTAINTY_MAX_ROWS: ${SC_WORKSPACE_UNCERTAINTY_MAX_ROWS:-10000}
      SC_WORKSPACE_UNCERTAINTY_MAX_VARIABLES: ${SC_WORKSPACE_UNCERTAINTY_MAX_VARIABLES:-64}
    networks:
      - sc-workspace-runtime
    cpus: 1.5
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m

  sc-workspace-optimization-runtime:
    build: ./optimization-runtime
    container_name: sc-workspace-optimization-runtime
    restart: unless-stopped
    environment:
      SC_WORKSPACE_OPTIMIZATION_RUNTIME_TOKEN: ${SC_WORKSPACE_RUNTIME_OPTIMIZATION_TOKEN}
      SC_WORKSPACE_OPTIMIZATION_MAX_DIMENSIONS: ${SC_WORKSPACE_OPTIMIZATION_MAX_DIMENSIONS:-32}
      SC_WORKSPACE_OPTIMIZATION_MAX_EVALUATIONS: ${SC_WORKSPACE_OPTIMIZATION_MAX_EVALUATIONS:-50000}
      SC_WORKSPACE_OPTIMIZATION_MAX_ITERATIONS: ${SC_WORKSPACE_OPTIMIZATION_MAX_ITERATIONS:-5000}
    networks:
      - sc-workspace-runtime
    cpus: 1.5
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m

  sc-workspace-decision-runtime:
    build: ./decision-runtime
    container_name: sc-workspace-decision-runtime
    restart: unless-stopped
    environment:
      SC_WORKSPACE_DECISION_RUNTIME_TOKEN: ${SC_WORKSPACE_RUNTIME_DECISION_TOKEN}
      SC_WORKSPACE_DECISION_MAX_CANDIDATES: ${SC_WORKSPACE_DECISION_MAX_CANDIDATES:-5000}
      SC_WORKSPACE_DECISION_MAX_SCENARIOS: ${SC_WORKSPACE_DECISION_MAX_SCENARIOS:-500}
      SC_WORKSPACE_DECISION_MAX_METRICS: ${SC_WORKSPACE_DECISION_MAX_METRICS:-64}
    networks:
      - sc-workspace-runtime
    cpus: 1.5
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m

  sc-workspace-reliability-runtime:
    build: ./reliability-runtime
    container_name: sc-workspace-reliability-runtime
    restart: unless-stopped
    environment:
      SC_WORKSPACE_RELIABILITY_RUNTIME_TOKEN: ${SC_WORKSPACE_RUNTIME_RELIABILITY_TOKEN}
      SC_WORKSPACE_RELIABILITY_MAX_SAMPLES: ${SC_WORKSPACE_RELIABILITY_MAX_SAMPLES:-20000}
      SC_WORKSPACE_RELIABILITY_MAX_COMPONENTS: ${SC_WORKSPACE_RELIABILITY_MAX_COMPONENTS:-1000}
      SC_WORKSPACE_RELIABILITY_MAX_GROUPS: ${SC_WORKSPACE_RELIABILITY_MAX_GROUPS:-256}
    networks:
      - sc-workspace-runtime
    cpus: 1.5
    mem_limit: 1g
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m

  sc-workspace-interchange-runtime:
    build: ./interchange-runtime
    container_name: sc-workspace-interchange-runtime
    restart: unless-stopped
    environment:
      SC_WORKSPACE_INTERCHANGE_RUNTIME_TOKEN: ${SC_WORKSPACE_RUNTIME_INTERCHANGE_TOKEN}
      SC_WORKSPACE_INTERCHANGE_MAX_PAYLOAD_BYTES: ${SC_WORKSPACE_MAX_ARTIFACT_BYTES:-26214400}
      SC_WORKSPACE_INTERCHANGE_MAX_ROWS: ${SC_WORKSPACE_COMPUTE_MAX_ROWS:-50000}
      SC_WORKSPACE_INTERCHANGE_MAX_COLUMNS: ${SC_WORKSPACE_COMPUTE_MAX_COLUMNS:-256}
    networks:
      - sc-workspace-runtime
    cpus: 1.5
    mem_limit: 1536m
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m

networks:
  sc-internal:
    external: true
  sc-workspace-runtime:
    driver: bridge
    internal: true

volumes:
  sc-workspace-data:
    external: true
    name: sc-workspace-data
